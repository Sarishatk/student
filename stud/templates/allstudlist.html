<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List all students</title>
</head>

<body>
    <h1>
        List All Students
    </h1>

    <div style="border: 1px solid; width: 50%; padding: 4px; border-collapse: collapse;">
        <table style="border: 1px solid black; border-collapse: collapse; width: 80%;">
            <tr>
                <th style="border: 1px solid black; padding: 8px;">Name</th>
                <th style="border: 1px solid black; padding: 8px;">Roll No</th>
                <th style="border: 1px solid black; padding: 8px;">Department</th>
                <th style="border: 1px solid black; padding: 8px;">Email</th>
                <th style="border: 1px solid black; padding: 8px;">Marks</th>
            </tr>

            {% for stud in all_stud %}
            <tr>
                <td style="border: 1px solid black; padding: 8px;">{{ stud.name }}</td>
                <td style="border: 1px solid black; padding: 8px;">{{ stud.roll_no }}</td>
                <td style="border: 1px solid black; padding: 8px;">{{ stud.department }}</td>
                <td style="border: 1px solid black; padding: 8px;">{{ stud.email }}</td>
                <td style="border: 1px solid black; padding: 8px;">{{ stud.marks }}</td>
            </tr>
            {% endfor %}
        </table>



    </div>


</body>

</html>
