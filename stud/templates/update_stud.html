<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-header bg-primary text-white text-center rounded-top-4">
            <h3 class="mb-0">Student Registration Form</h3>
          </div>
          <div class="card-body p-4">

            <!-- IMPORTANT: Django form -->
            <form method="POST" action="">
              {% csrf_token %}   

              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input value="{{stud_data.name}}" type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
              </div>

              <div class="mb-3">
                <label for="rollno"  class="form-label">Roll Number</label>
                <input type="text" value="{{stud_data.roll_no}}" class="form-control" id="rollno" name="rollno" placeholder="Enter roll number" required>
              </div>

              <div class="mb-3">
                <label for="dept"  class="form-label">Department</label>
                <select class="form-select" id="dept" name="dept" required>
                  <option value="{{stud_data.department }}">Choose department</option>
                  <option>Computer Science</option>
                  <option>Electronics</option>
                  <option>Commerce</option>
                  <option>Mathematics</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" value="{{stud_data.email}}" class="form-control" id="email" name="email" placeholder="Enter your email" required>
              </div>

              <div class="mb-3">
                <label for="mark" class="form-label">Total Mark</label>
                <input type="number" value="{{stud_data.marks}}" class="form-control" id="mark" name="mark" placeholder="Enter total mark" required>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Submit</button>
                <button type="reset" class="btn btn-secondary px-4 ms-2">Reset</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
